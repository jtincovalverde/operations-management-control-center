name: Operations Control Center CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run operations analysis
        run: python analyze.py

      - name: Verify generated outputs
        run: |
          test -f management_summary.csv
          test -f capacity_vs_load.svg
          test -f executive_summary.md
